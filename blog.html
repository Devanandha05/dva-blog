<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blog — DVA | Ideas &amp; Inspiration</title>
  <meta name="description" content="Browse creative ideas, beautiful designs and inspiration across art, fashion, beauty and weddings." />

  <link rel="canonical" href="https://dva-blog.vercel.app//blog.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DVA" />
  <meta property="og:title" content="Blog — DVA | Ideas &amp; Inspiration" />
  <meta property="og:description" content="Browse creative ideas, beautiful designs and inspiration across art, fashion, beauty and weddings." />
  <meta property="og:url" content="https://dva-blog.vercel.app//blog.html" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog — DVA | Ideas &amp; Inspiration" />
  <meta name="twitter:description" content="Browse creative ideas, beautiful designs and inspiration across art, fashion, beauty and weddings." />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR — same block on every page. -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">DVA</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
      </nav>
    </div>
  </header>

<main class="blog-page">

  <!-- Header band with floating photos -->
  <section class="blog-hero">
    <div class="blog-hero-blob blob-1"></div>
    <div class="blog-hero-blob blob-2"></div>

    <div class="hero-photo hero-photo-left">
      <img src="images/hero/wedding-hero.png" alt="" />
    </div>
    <div class="hero-photo hero-photo-right">
      <img src="images/hero/oil-pastel-hero.png" alt="" />
    </div>

    <div class="blog-header">
      <p class="kicker">The journal</p>
      <h1>Ideas &amp; Inspiration</h1>
      <p>
        Discover creative ideas, beautiful designs and inspiration
        across art, fashion, beauty and weddings.
      </p>
    </div>
  </section>

  <!-- Filled by JavaScript -->
  <div class="blog-filters" id="blog-filters"></div>
  <section class="blog-feature" id="blog-feature"></section>
  <section class="blog-grid" id="blog-grid"></section>

</main>
  <footer>
    <p>&copy; 2026 DVA. Creative ideas &amp; inspiration.</p>
  </footer>

  <!-- ============================================
       SCRIPT LOAD ORDER MATTERS:
       articles-data.js must load BEFORE main.js,
       because main.js's renderBlogGrid() function
       expects the "articles" array to already exist.
       ============================================ -->
  <script src="js/articles-data.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
